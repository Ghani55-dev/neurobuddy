
<style>
  /* Restricted Access Page Styling */
.restricted-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
  padding: 2rem;
  text-align: center;
}

.restricted-icon {
  font-size: 3rem;
  margin-bottom: 1.5rem;
  color: var(--primary-color);
  animation: pulse 2s infinite;
}

.dark-theme .restricted-icon {
  color: var(--dark-primary);
}

.restricted-title {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--text-primary);
}

.dark-theme .restricted-title {
  color: var(--dark-text-primary);
}

.restricted-message {
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
  max-width: 30rem;
  line-height: 1.6;
}

.dark-theme .restricted-message {
  color: var(--dark-text-secondary);
}

.restricted-links {
  display: flex;
  gap: 1.5rem;
  margin-top: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
}

.restricted-link {
  padding: 0.75rem 1.5rem;
  border-radius: 0.5rem;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.restricted-link-primary {
  background-color: rgba(99, 102, 241, 0.1);;
  color: green;
}

.restricted-link-primary:hover {
  background-color: var(--primary-hover);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
}

.dark-theme .restricted-link-primary {
  background-color: var(--dark-primary);
}

.dark-theme .restricted-link-primary:hover {
  background-color: rgba(99, 102, 241, 0.1);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(74, 91, 250, 0.3);
}

.restricted-link-secondary {
  color: var(--primary-color);
  border: 1px solid var(--primary-color);
}

.restricted-link-secondary:hover {
  background-color: rgba(99, 102, 241, 0.1);
  transform: translateY(-2px);
}

.dark-theme .restricted-link-secondary {
  color: var(--dark-primary);
  border-color: var(--dark-primary);
}

.dark-theme .restricted-link-secondary:hover {
  background-color: rgba(0, 25, 252, 0.1);
}

/* Animation */
@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.1);
  }
  100% {
    transform: scale(1);
  }
}

/* Responsive Design */
@media (max-width: 640px) {
  .restricted-container {
    padding: 1.5rem;
    min-height: 60vh;
  }
  
  .restricted-title {
    font-size: 1.75rem;
  }
  
  .restricted-message {
    font-size: 1rem;
  }
  
  .restricted-links {
    flex-direction: column;
    gap: 1rem;
    width: 100%;
  }
  
  .restricted-link {
    width: 100%;
    justify-content: center;
    
  }
}
</style>
{% extends 'base.html' %}
{% block content %}
<div class="restricted-container">
  <div class="restricted-icon">🔐</div>
  <h1 class="restricted-title">Access Restricted</h1>
  <p class="restricted-message">
    You need to log in to access this page. Please authenticate to continue.
  </p>
  <div class="restricted-links">
    <a href="{% url 'login' %}" class="restricted-link restricted-link-primary">
      <i class="fas fa-sign-in-alt"></i> Login
    </a>
    <a href="{% url 'register' %}" class="restricted-link restricted-link-secondary">
      <i class="fas fa-user-plus"></i> Create Account
    </a>
  </div>
</div>
{% endblock %}
