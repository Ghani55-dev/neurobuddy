<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #007BFF, #00C6FF);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .success-box {
            background: rgba(0,0,0,0.3);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .success-icon {
            font-size: 80px;
            color: #00ffae;
        }
    </style>
</head>
<body>
    <div class="success-box">
        <div class="success-icon">✅</div>
        <h2>Video Uploaded Successfully!</h2>
        <p>Your video has been uploaded and saved in the system.when admin approved your video show in Browse videos</p>
        <a href="{% url 'entertainment:upload_video' %}" class="btn btn-light mt-3">Upload Another Video</a>
        <a href="{% url 'entertainment:video_list' %}" class="btn btn-outline-light mt-3 ms-2">see upload videos</a>
        <b>or<b>
         <a href="{% url 'dashboard' %}" class="btn btn-outline-light mt-3 ms-2">✅Dashboard</a>

    </div>
</body>
</html>
