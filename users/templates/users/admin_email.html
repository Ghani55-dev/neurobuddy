<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fc; margin: 0; padding: 20px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);">
        <div style="background: linear-gradient(135deg, #6e8efb, #a777e3); color: white; padding: 25px 30px; text-align: center;">
            <h2 style="margin: 0; font-size: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center;">
                <span style="margin-right: 12px; font-size: 28px;">📧</span>
                New Contact Form Submission 🚀
            </h2>
        </div>
        
        <div style="padding: 30px;">
            <div style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f0f0f0;">
                <span style="font-weight: 600; color: #6e8efb; margin-bottom: 8px; display: block; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">Name</span>
                <p style="font-size: 16px; line-height: 1.5; color: #444; margin: 0; padding: 8px 12px; background-color: #f8f9ff; border-radius: 6px; border-left: 3px solid #a777e3;">{{ name }}</p>
            </div>
            
            <div style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f0f0f0;">
                <span style="font-weight: 600; color: #6e8efb; margin-bottom: 8px; display: block; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">Email</span>
                <p style="font-size: 16px; line-height: 1.5; color: #444; margin: 0; padding: 8px 12px; background-color: #f8f9ff; border-radius: 6px; border-left: 3px solid #a777e3;">{{ email }}</p>
            </div>
            
            <div style="margin-bottom: 20px; padding-bottom: 20px;">
                <span style="font-weight: 600; color: #6e8efb; margin-bottom: 8px; display: block; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">Message</span>
                <p style="font-size: 16px; line-height: 1.5; color: #444; margin: 0; padding: 8px 12px; background-color: #f8f9ff; border-radius: 6px; border-left: 3px solid #a777e3; white-space: pre-wrap; min-height: 100px;">{{ message }}</p>
            </div>
        </div>
        
        <div style="text-align: center; padding: 20px; background-color: #f8f9ff; font-size: 12px; color: #888; border-top: 1px solid #eee;">
            <p>This message was sent from <span style="color: #6e8efb; font-weight: 600;">NeuroBuddy</span> contact form.</p>
        </div>
    </div>
</body>
</html>
