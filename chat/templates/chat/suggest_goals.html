<style>
    /* Mood Form Styles */
    .mood-form-container {
        background: rgba(106, 17, 203, 0.05);
        border-radius: 12px;
        padding: 2rem;
        margin-bottom: 2rem;
        border: 1px solid rgba(106, 17, 203, 0.1);
    }

    .dark-theme .mood-form-container {
        background: rgba(138, 43, 226, 0.08);
        border-color: rgba(138, 43, 226, 0.2);
    }

    .mood-input {
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .mood-input input {
        flex: 1;
        padding: 0.85rem 1.25rem;
        border: 1px solid rgba(106, 17, 203, 0.3);
        border-radius: 50px;
        font-size: 1rem;
        background: white;
        transition: all 0.3s ease;
    }

    .dark-theme .mood-input input {
        background: #1e1e1e;
        border-color: rgba(138, 43, 226, 0.4);
        color: white;
    }

    .mood-input input:focus {
        outline: none;
        border-color: #6a11cb;
        box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
    }

    .mood-input button {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: white;
        border: none;
        padding: 0.85rem 1.75rem;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        white-space: nowrap;
    }

    .mood-input button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
    }

    /* Goals Styles */
    .goals-container {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        margin-bottom: 2rem;
    }

    .dark-theme .goals-container {
        background: #1e1e1e;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .goals-header {
        display: flex;
        align-items: center;
        margin-bottom: 1.5rem;
        color: #6a11cb;
    }

    .dark-theme .goals-header {
        color: #8a2be2;
    }

    .goals-header h2 {
        font-weight: 700;
        margin: 0;
        font-size: 1.5rem;
    }

    .goals-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .goal-item {
        padding: 1.25rem;
        margin-bottom: 0.75rem;
        background: rgba(106, 17, 203, 0.03);
        border-radius: 8px;
        display: flex;
        align-items: center;
        transition: all 0.3s ease;
        border-left: 3px solid #6a11cb;
    }

    .dark-theme .goal-item {
        background: rgba(138, 43, 226, 0.08);
        border-left-color: #8a2be2;
    }

    .goal-item:hover {
        transform: translateX(5px);
        background: rgba(106, 17, 203, 0.08);
    }

    .dark-theme .goal-item:hover {
        background: rgba(138, 43, 226, 0.15);
    }

    .goal-text {
        flex: 1;
        margin-right: 1rem;
    }

    .goal-progress {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .goal-checkbox {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 2px solid #6a11cb;
        appearance: none;
        cursor: pointer;
        position: relative;
        transition: all 0.2s ease;
    }

    .goal-checkbox:checked {
        background-color: #6a11cb;
        border-color: #6a11cb;
    }

    .goal-checkbox:checked::after {
        content: '✓';
        position: absolute;
        color: white;
        font-size: 12px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .goal-date {
        font-size: 0.8rem;
        color: #7f8c8d;
    }

    .dark-theme .goal-date {
        color: #b0b0b0;
    }

    .no-goals {
        text-align: center;
        padding: 1.5rem;
        color: #7f8c8d;
        font-style: italic;
    }

    .dark-theme .no-goals {
        color: #b0b0b0;
    }

    /* Animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .goal-item {
        animation: fadeIn 0.4s ease-out forwards;
        animation-delay: calc(var(--i) * 0.1s);
        opacity: 0;
    }

    .delete-btn {
        background: #ff4d4d;
        border: none;
        color: white;
        padding: 0.5rem 0.9rem;
        border-radius: 50px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-left: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.3rem;
    }

    .delete-btn:hover {
        background: #e60000;
        box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3);
        transform: translateY(-2px);
    }

    /* Delete animation */
    .fade-out {
        animation: fadeOut 0.4s ease forwards;
    }

    @keyframes fadeOut {
        to {
            opacity: 0;
            transform: translateX(-20px);
            height: 0;
            margin: 0;
            padding: 0;
        }
    }

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
        .mood-form-container {
            padding: 1.25rem;
            margin: 0 0.75rem 1.5rem;
            border-radius: 10px;
        }
        
        .mood-input {
            flex-direction: column;
            gap: 1rem;
        }
        
        .mood-input input,
        .mood-input button {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
        }
        
        .goals-container {
            padding: 1.25rem;
            margin: 0 0.75rem 1.5rem;
            border-radius: 10px;
        }
        
        .goals-header {
            margin-bottom: 1.25rem;
        }
        
        .goals-header h2 {
            font-size: 1.3rem;
        }
        
        .goal-item {
            flex-direction: column;
            align-items: flex-start;
            padding: 1rem;
            margin-bottom: 0.9rem;
            border-left-width: 2px;
        }
        
        .goal-text {
            margin-right: 0;
            margin-bottom: 0.75rem;
            width: 100%;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        .goal-progress {
            margin-top: 0.5rem;
            align-self: stretch;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            width: 100%;
        }
        
        .goal-checkbox {
            width: 22px;
            height: 22px;
        }
        
        .goal-date {
            font-size: 0.8rem;
            margin-right: auto;
            padding-left: 0.5rem;
        }
        
        .delete-btn {
            margin-left: 0;
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            order: 2;
            width: 100%;
            justify-content: center;
            margin-top: 0.5rem;
        }
        
        .no-goals {
            padding: 1.25rem;
            font-size: 0.95rem;
        }
    }

    /* Small mobile devices */
    @media (max-width: 480px) {
        .mood-form-container {
            padding: 1rem;
            margin: 0 0.5rem 1.25rem;
        }
        
        .mood-input {
            gap: 0.85rem;
        }
        
        .mood-input input {
            padding: 0.8rem 1rem;
        }
        
        .mood-input button {
            padding: 0.8rem 1rem;
        }
        
        .goals-container {
            padding: 1rem;
            margin: 0 0.5rem 1.25rem;
        }
        
        .goals-header h2 {
            font-size: 1.2rem;
        }
        
        .goal-item {
            padding: 0.9rem;
        }
        
        .goal-text {
            font-size: 0.9rem;
        }
        
        .goal-progress {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.6rem;
        }
        
        .goal-date {
            padding-left: 0;
        }
        
        .delete-btn {
            margin-top: 0.75rem;
        }
    }
</style>

<div class="mood-form-container">
    <form method="post" class="mood-input">
        {% csrf_token %}
        <input type="text" name="mood_input" placeholder="How are you feeling today?" required>
        <button type="submit">
            <i class="fas fa-lightbulb me-2"></i>Get Suggestions
        </button>
    </form>
</div>

<div class="goals-container">
    <div class="goals-header">
        <h2><i class="fas fa-bullseye me-2"></i>🤖AI Suggestions</h2>
    </div>
    
    <ul class="goals-list">
        {% for goal in todays_goals %}
            <li class="goal-item" style="--i: {{ forloop.counter0 }};" id="goal-{{ goal.id }}">
                <div class="goal-text">{{ goal.text }}</div>
                <div class="goal-progress">
                    {% for p in goal.progress.all %}
                        <input type="checkbox" 
                               class="goal-checkbox" 
                               data-url="{% url 'toggle_goal_completion' p.id %}" 
                               {% if p.completed %}checked{% endif %}>
                        <span class="goal-date">{{ p.date|date:"M j" }}</span>
                    {% endfor %}

                    <!-- Delete button -->
                   <button class="delete-btn" data-goal-id="{{ goal.id }}" 
        data-url="{% url 'delete_goal' goal.id %}">
    <i class="fas fa-trash-alt"></i> Delete
</button>
                </div>
            </li>
        {% empty %}
            <li class="no-goals">No goals for today yet. Add some to stay productive!</li>
        {% endfor %}
    </ul>
</div>

<script>
/* Checkbox toggle functionality */
document.querySelectorAll('.goal-checkbox').forEach(box => {
    box.addEventListener('change', (e) => {
        const goalItem = box.closest('.goal-item');

        // Visual feedback
        if (box.checked) {
            goalItem.style.opacity = '0.7';
            goalItem.style.textDecoration = 'line-through';
        } else {
            goalItem.style.opacity = '1';
            goalItem.style.textDecoration = 'none';
        }

        // Use the data-url generated by Django
        fetch(box.dataset.url, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
        }).then(response => {
            if (!response.ok) {
                // Revert if failed
                box.checked = !box.checked;
                goalItem.style.opacity = '1';
                goalItem.style.textDecoration = 'none';
            }
        });
    });
});

/* Delete functionality */
document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        const goalItem = document.getElementById(`goal-${this.dataset.goalId}`);

        fetch(this.dataset.url, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
            },
        }).then(response => {
            if (response.ok) {
                goalItem.classList.add('fade-out');
                setTimeout(() => goalItem.remove(), 400);
            }
        });
    });
});
</script>
